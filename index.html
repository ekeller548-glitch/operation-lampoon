<!DOCTYPE html>
<html>
<head>
    <title>Password Hash Generator</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 40px; text-align: center; }
        input { padding: 10px; width: 300px; background: #000; color: #0f0; border: 1px solid #0f0; font-family: inherit; }
        button { padding: 10px 20px; background: #0f0; border: none; font-weight: bold; cursor: pointer; }
        #output { margin-top: 20px; font-size: 1.2em; color: #fff; word-break: break-all; max-width: 600px; margin-left: auto; margin-right: auto;}
    </style>
</head>
<body>
    <h2>Password to SHA-256 Code Converter</h2>
    <input type="text" id="pass" placeholder="Type your password here...">
    <button onclick="generate()">Generate Hash</button>
    <div id="output"></div>

    <script>
        async function generate() {
            const str = document.getElementById('pass').value;
            const utf8 = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const finalHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            document.getElementById('output').innerHTML = `<strong>Your Hash String:</strong><br><br>${finalHash}`;
        }
    </script>
</body>
</html>
